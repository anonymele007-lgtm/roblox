
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation Roblox</title>
<style>
body {
 background-image: url("fond-roblox.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.card {
  background: #393b3e;
  padding: 30px;
  border-radius: 12px;
  width: 300px;
  text-align: center;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 6px;
}
input {
  border: 1px solid #777;
}
button {
  background: #00a2ff;
  color: white;
  border: none;
  cursor: pointer;
}
.notice {
  color: #ffd166;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="card">
  <h1>ROBLOX</h1>
  <p class="notice">SIMULATION ÉDUCATIVE</p>
  <p>Page de démonstration</p>

  <input placeholder="Nom fictif (ex: Joueur123)">

  <button onclick="alert('Simulation ! Ne saisis jamais ton vrai mot de passe sur un lien inconnu.')">
    Tester la démonstration
  </button>

  <p class="notice">
    Aucun identifiant ni mot de passe n'est collecté.
  </p>
</div>
</body>
</html>
