
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo éducative gaming</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background-image: url("fond-roblox.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-color: #202124;
  color: #222;
  font-family: Arial, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

/* Carré blanc au centre */
.card {
  background: white;
  padding: 35px;
  border: none;
  border-radius: 18px;
  width: 100%;
  max-width: 460px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

h1 {
  font-size: 38px;
  margin-top: 0;
  letter-spacing: 2px;
  color: #222;
}

h2 {
  font-size: 24px;
  margin-bottom: 10px;
}

.notice {
  color: #666;
  font-size: 13px;
  line-height: 1.5;
}

input, button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border-radius: 8px;
  font-size: 15px;
}

input {
  border: 1px solid #ccc;
  background: white;
  color: #222;
}

button {
  background: #252525;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #444;
}

footer {
  font-size: 11px;
  color: #777;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">

  <h1>GAMING</h1>

  <h2>Connexion démo</h2>

  <p class="notice">
    Bienvenue dans notre démonstration !
  </p>

  <input
    type="text"
    id="pseudo"
    placeholder="Entre un pseudo fictif"
    maxlength="20"
  >

  <button onclick="demonstration()">
    Tester la démonstration
  </button>

  <p class="notice" id="message">
    Utilise uniquement un pseudo inventé.
  </p>

  <footer>
    Projet indépendant et non officiel.
    Aucun mot de passe n'est demandé ou enregistré.
  </footer>

</div>

<script>
function demonstration() {
  const pseudo = document.getElementById("pseudo").value.trim();
  const message = document.getElementById("message");

  if (!pseudo) {
    message.textContent = "Entre un pseudo fictif pour continuer.";
    return;
  }

  message.textContent =
    "Bonjour " + pseudo +
    " ! Ceci est une simulation éducative. Ne partage jamais ton mot de passe.";
}
</script>

</body>
</html>
